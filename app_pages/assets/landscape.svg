<svg class="nl-landscape" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Animated Norwegian landscape: snow on the mountains melts into a hydropower reservoir, and power lines carry the energy to a town">
<style>
  .nl-landscape { width: 100%; height: auto; display: block; border-radius: 0.5rem; }
  .nl-cloud { animation: nl-drift 70s linear infinite; }
  .nl-cloud.c2 { animation-duration: 95s; animation-delay: -40s; }
  .nl-cloud.c3 { animation-duration: 120s; animation-delay: -75s; }
  @keyframes nl-drift { from { transform: translateX(-260px); } to { transform: translateX(1300px); } }

  /* one year in 16 s: winter drains the reservoir, the spring melt fills it */
  .nl-water { animation: nl-level 16s ease-in-out infinite; }
  @keyframes nl-level {
    0% { transform: translateY(12px); } 25% { transform: translateY(30px); }
    50% { transform: translateY(3px); } 75% { transform: translateY(0); } 100% { transform: translateY(12px); }
  }
  .nl-snow { animation: nl-snow 16s ease-in-out infinite; }
  @keyframes nl-snow {
    0%, 25% { opacity: 1; } 50% { opacity: 0.15; } 75% { opacity: 0.15; } 100% { opacity: 1; }
  }
  .nl-ripple { animation: nl-ripple 4s ease-in-out infinite; }
  @keyframes nl-ripple { 50% { transform: translateX(14px); } }

  .nl-outflow { stroke-dasharray: 3 5; animation: nl-flow 0.6s linear infinite; }
  @keyframes nl-flow { to { stroke-dashoffset: -8; } }
  .nl-cable { fill: none; stroke: #3a3f44; stroke-width: 0.9; }
  .nl-pulse { fill: none; stroke: #ffc94a; stroke-width: 2.2; stroke-linecap: round;
              stroke-dasharray: 5 140; animation: nl-pulse 2.4s linear infinite; }
  @keyframes nl-pulse { from { stroke-dashoffset: 145; } to { stroke-dashoffset: 0; } }
  .nl-pylon path { fill: none; stroke: #3a3f44; stroke-width: 1.3; stroke-linejoin: round; }
  .nl-window { animation: nl-glow 2.4s ease-in-out infinite; }
  @keyframes nl-glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

  .nl-season { font: 600 15px "Source Sans Pro", "Source Sans 3", sans-serif; fill: #FAF6EE; opacity: 0;
               animation: nl-season 16s linear infinite; }
  .nl-season.s2 { animation-delay: 4s; } .nl-season.s3 { animation-delay: 8s; } .nl-season.s4 { animation-delay: 12s; }
  @keyframes nl-season { 0% { opacity: 0; } 3%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .nl-landscape * { animation: none !important; }
    .nl-season.s1 { opacity: 1; }
  }
</style>
<defs>
  <linearGradient id="nl-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9cc3e8"/><stop offset="1" stop-color="#f3ecdd"/>
  </linearGradient>
  <linearGradient id="nl-lake" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3f86c9"/><stop offset="1" stop-color="#2B6CB0"/>
  </linearGradient>
  <clipPath id="nl-basin"><path d="M335,212 L612,212 L612,250 Q470,262 340,246 Z"/></clipPath>
  <g id="nl-cloudshape">
    <ellipse cx="0" cy="0" rx="38" ry="12"/><ellipse cx="-16" cy="-8" rx="18" ry="11"/><ellipse cx="12" cy="-10" rx="20" ry="13"/>
  </g>
</defs>

<rect width="1200" height="300" fill="url(#nl-sky)"/>
<circle cx="1010" cy="58" r="26" fill="#ffe7a8" opacity="0.9"/>
<g fill="#ffffff" opacity="0.85">
  <use href="#nl-cloudshape" class="nl-cloud" x="0" y="45"/>
  <use href="#nl-cloudshape" class="nl-cloud c2" x="0" y="80" transform="scale(0.8)"/>
  <use href="#nl-cloudshape" class="nl-cloud c3" x="0" y="30"/>
</g>

